[common]
log-level=DEBUG
log-file-path={project_root}/logs
version=1.0
api-root=v1
health_check_endpoint=check

[swagger]
title=KUDOS RAG API
summary=팀 Confluence + OpenAPI 기반 RAG (local)

[fastapi]
host=127.0.0.1
port=5010
reload=True

[ollama]
base-url=http://127.0.0.1:11434
llm-model=qwen3:14b
embedding-model=bge-m3
num-ctx=16384
temperature=0
llm-timeout=120

[chroma]
persist-dir={project_root}/data/chroma
collection=kudos_rag
manifest-path={project_root}/data/manifest.json

[confluence]
base-url=https://ihunet.atlassian.net/wiki
space-key=KUDOS
email=
api-token=

[openapi]
sources-file={project_root}/resources/openapi_sources.yaml

[retrieval]
chunk-size=1000
chunk-overlap=150
top-k=6
bm25-k=10
vector-k=10
bm25-weight=0.4
vector-weight=0.6
embed-batch-size=32
